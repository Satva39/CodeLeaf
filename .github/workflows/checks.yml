name: CodeLeaf CI checks
on:
  push:
  pull_request:
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --check 'api/proxy/[...path].js'
      - run: node scripts/test_api_proxy.mjs
      - run: npm run test:api-client
      - run: npm run test:auth-ui
      - run: npm run build
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: codeleaf-ci-only-not-for-deployment
      DATABASE_URL: sqlite:///./codeleaf-ci-placeholder.db
      COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: http://localhost:5173
      PREVIEW_DRAFT_COURSES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts alembic
      - run: python scripts/check_alembic_heads.py
      - run: python scripts/check_repository_hygiene.py
      - run: python scripts/validate_course_manifests.py --course html
      - run: python scripts/validate_course_manifests.py
      - run: python scripts/test_phase1_config.py
      - run: python scripts/test_auth_lifecycle.py
      - run: python scripts/test_dynamic_diagram_compatibility.py
      - run: python scripts/test_course_api_contract.py
      - run: python scripts/test_phase3_catalog_contract.py
      - run: python scripts/test_knowledge_check_api.py
      - run: python scripts/test_import_slug_rename.py
      - run: python scripts/test_course_import_safety.py
      - run: python scripts/test_migration_repeatability.py
      - run: python scripts/check_release_readiness.py --skip-content-validation
