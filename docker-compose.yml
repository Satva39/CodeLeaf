services:
  postgres:
    image: postgres:16-alpine
    container_name: codeleaf-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeleaf}
      POSTGRES_USER: ${POSTGRES_USER:-codeleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - codeleaf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  codeleaf_postgres_data:
