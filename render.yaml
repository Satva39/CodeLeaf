services:
  - type: web
    name: codeleaf-api
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CodeLeaf API
      - key: API_PREFIX
        value: /api
      - key: PREVIEW_DRAFT_COURSES
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: AUTH_RATE_LIMIT_MAX_ATTEMPTS
        value: "8"
