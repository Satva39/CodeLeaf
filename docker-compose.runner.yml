# Local-only example. Mounting docker.sock grants strong control over this host;
# run this stack only on a dedicated, disposable runner machine.
services:
  codeleaf-runner:
    build: ./runner_service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RUNNER_SERVICE_TOKEN: ${RUNNER_SERVICE_TOKEN:?Set a random 32+ character token}
      RUNNER_PYTHON_IMAGE: ${RUNNER_PYTHON_IMAGE:?Set an immutable SHA-256 image ID/reference}
      RUNNER_NODE_IMAGE: ${RUNNER_NODE_IMAGE:?Set an immutable SHA-256 image ID/reference}
      RUNNER_JOB_TIMEOUT_SECONDS: "4"
      RUNNER_MAX_CONCURRENT: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
